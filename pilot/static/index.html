<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Automation console</title>
<style>
  :root{--navy:#0B1D3A;--blue:#246BFD;--cyan:#67E8F9;--surface:#F7FAFE;--pale:#ECF4FF;--line:#DCE5F0;--muted:#65758C;--ok:#1B9E5A;--warn:#D98A00;--bad:#D6453D}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,"Segoe UI",Inter,Arial,sans-serif;background:var(--surface);color:var(--navy)}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;background:#fff;border-bottom:1px solid var(--line)}
  header h1{font-size:16px;margin:0;display:flex;align-items:center;gap:10px}
  header h1 span{font-weight:400;color:var(--muted);font-size:13px}
  .dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--cyan))}
  button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--navy);padding:7px 12px;border-radius:6px;cursor:pointer}
  button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  button:disabled{opacity:.5;cursor:default}
  main{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;padding:16px 22px;max-width:1500px;margin:0 auto}
  .panel{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .panel h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .stats{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .stat{flex:1;min-width:90px;background:var(--pale);border-radius:8px;padding:8px 10px}
  .stat b{display:block;font-size:20px}
  .stat small{color:var(--muted)}
  table{width:100%;border-collapse:collapse}
  th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  tr.row{cursor:pointer}
  tr.row:hover,tr.row.sel{background:var(--pale)}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;color:#fff;background:var(--muted)}
  .pill.matched,.pill.approved{background:var(--ok)}.pill.review{background:var(--warn)}.pill.rejected,.pill.error{background:var(--bad)}
  .pill.extracting,.pill.matching{background:var(--blue)}
  .detail{padding:14px 16px;min-height:200px}
  .detail dl{display:grid;grid-template-columns:130px 1fr;gap:4px 10px;margin:0 0 12px}
  .detail dt{color:var(--muted)}.detail dd{margin:0}
  .reasons li{margin:2px 0}
  .actions{display:flex;gap:8px;margin-top:12px}
  .approve{background:var(--ok);border-color:var(--ok);color:#fff}.reject{background:var(--bad);border-color:var(--bad);color:#fff}
  .log{font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;background:var(--navy);color:#B8C6DC;padding:12px 14px;height:360px;overflow:auto;white-space:pre-wrap;word-break:break-word}
  .log .t{color:#6B7F9E}.log .warn{color:#FFD166}.log .error{color:#FF8A80}.log .info{color:#B8C6DC}
  footer{padding:10px 22px;color:var(--muted);font-size:12px}
  @media(max-width:900px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1><i class="dot"></i>Automation console <span id="mode"></span></h1>
  <div>
    <button id="load" class="primary">Load 20 sample invoices</button>
    <label><input id="file" type="file" accept="application/pdf" hidden><button onclick="document.getElementById('file').click()">Upload PDF</button></label>
    <button id="reset">Reset</button>
    <a href="/api/ledger" style="margin-left:8px">ledger.csv</a>
  </div>
</header>
<main>
  <section class="panel">
    <h2>Queue <span id="count"></span></h2>
    <div class="stats" id="stats"></div>
    <table><thead><tr><th>#</th><th>Vendor / invoice</th><th>Total</th><th>PO</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table>
  </section>
  <div style="display:flex;flex-direction:column;gap:16px">
    <section class="panel"><h2>Detail</h2><div class="detail" id="detail"><em style="color:var(--muted)">Select an invoice.</em></div></section>
    <section class="panel"><h2>Run log</h2><div class="log" id="log"></div></section>
  </div>
</main>
<footer>Workflow Automation Pilot - reference implementation by JoyfulAI. Sample data is synthetic; no real companies or transactions.</footer>
<script>
let sel=null, state={invoices:[],events:[]};
const $=id=>document.getElementById(id);
const fmt=(n,c='SGD')=>c+' '+Number(n).toLocaleString('en-SG',{minimumFractionDigits:2,maximumFractionDigits:2});
async function api(p,o){const r=await fetch(p,Object.assign({method:'POST'},o));if(!r.ok)alert((await r.json()).detail||r.status);}
async function refresh(){
  const r=await fetch('/api/state');state=await r.json();
  $('mode').textContent='extractor: '+state.extractor;
  const inv=state.invoices, by=s=>inv.filter(i=>i.status===s).length;
  $('count').textContent=inv.length+' invoices';
  $('stats').innerHTML=[['matched','Auto-matched',by('matched')],['review','Needs review',by('review')],['approved','Approved',by('approved')],['rejected','Rejected',by('rejected')],['active','Processing',inv.filter(i=>['queued','extracting','matching'].includes(i.status)).length]]
    .map(([k,l,v])=>`<div class="stat"><b>${v}</b><small>${l}</small></div>`).join('');
  $('rows').innerHTML=inv.map(i=>`<tr class="row ${sel===i.id?'sel':''}" data-id="${i.id}"><td>${i.id}</td><td>${i.invoice?`<b>${i.invoice.vendor_name}</b><br><small>${i.invoice.invoice_number} · ${i.invoice.invoice_date||''}</small>`:`<small>${i.file}</small>`}</td><td>${i.invoice?fmt(i.invoice.total,i.invoice.currency):'-'}</td><td>${i.match&&i.match.po_number?i.match.po_number:'-'}</td><td><span class="pill ${i.status}">${i.status}</span></td></tr>`).join('');
  document.querySelectorAll('tr.row').forEach(tr=>tr.onclick=()=>{sel=+tr.dataset.id;render();});
  const log=$('log'),atBottom=log.scrollTop+log.clientHeight>=log.scrollHeight-20;
  log.innerHTML=state.events.map(e=>`<div><span class="t">${new Date(e.ts).toLocaleTimeString("en-GB")}</span> ${e.invoice_id?'#'+e.invoice_id+' ':''}<span class="${e.level}">${esc(e.message)}</span></div>`).join('');
  if(atBottom)log.scrollTop=log.scrollHeight;
  render();
}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function render(){
  const i=state.invoices.find(x=>x.id===sel);if(!i)return;
  const v=i.invoice,m=i.match;
  let h=`<dl><dt>File</dt><dd>${i.file}</dd><dt>Status</dt><dd><span class="pill ${i.status}">${i.status}</span></dd>`;
  if(v)h+=`<dt>Vendor</dt><dd>${v.vendor_name}</dd><dt>Invoice</dt><dd>${v.invoice_number} · ${v.invoice_date||'-'}</dd><dt>PO on invoice</dt><dd>${v.po_number||'-'}</dd><dt>Total</dt><dd>${fmt(v.total,v.currency)} <small style="color:var(--muted)">(subtotal ${fmt(v.subtotal,v.currency)}, tax ${fmt(v.tax,v.currency)})</small></dd><dt>Confidence</dt><dd>${Math.round(v.confidence*100)}%</dd>`;
  h+='</dl>';
  if(v&&v.line_items.length)h+=`<table><thead><tr><th>Item</th><th>Qty</th><th>Amount</th></tr></thead><tbody>${v.line_items.map(l=>`<tr><td>${l.description}</td><td>${l.quantity}</td><td>${fmt(l.amount,v.currency)}</td></tr>`).join('')}</tbody></table>`;
  if(m)h+=`<p style="margin:12px 0 4px"><b>Decision: ${m.decision}</b>${m.po_number?' · PO '+m.po_number:''}</p><ul class="reasons">${m.reasons.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`;
  if(i.status==='review')h+=`<div class="actions"><button class="approve" onclick="api('/api/invoices/${i.id}/approve').then(refresh)">Approve &amp; post to ledger</button><button class="reject" onclick="api('/api/invoices/${i.id}/reject').then(refresh)">Reject</button></div>`;
  $('detail').innerHTML=h;
}
$('load').onclick=()=>api('/api/demo/load').then(refresh);
$('reset').onclick=()=>{if(confirm('Clear all invoices, events and the ledger?')){sel=null;api('/api/demo/reset').then(refresh);}};
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const fd=new FormData();fd.append('file',f);await api('/api/upload',{body:fd});e.target.value='';refresh();};
refresh();setInterval(refresh,1500);
</script>
</body>
</html>
